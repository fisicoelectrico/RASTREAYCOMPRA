# Compila la APK de Android en cada push que toque la app y la deja para descargar
# en la pestaña Actions → la ejecución → "Artifacts" → rastreaycompra-apk.
name: APK Android

on:
  push:
    paths:
      - "app/**"
      - "supabase/functions/_shared/**"
      - ".github/workflows/apk.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Instalar dependencias
        run: npm ci

      - name: Construir la web y copiarla a Android
        run: npm run build:apk

      - name: Compilar APK
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Renombrar
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "RastreaYCompra-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: rastreaycompra-apk
          path: app/RastreaYCompra-*.apk
          retention-days: 30
