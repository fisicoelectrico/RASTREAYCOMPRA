# Compila la APK (TWA) y la deja para descargar en Actions → la ejecución → Artifacts → rastreaycompra-apk.
# Solo corre cuando cambia la parte nativa (carpeta twa/). Los cambios de interfaz NO necesitan APK
# nueva: llegan solos por la web (ver web.yml).
name: APK Android

on:
  push:
    paths:
      - "twa/**"
      - ".github/workflows/apk.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: twa
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # Dominio de la PWA: variable TWA_HOST del repositorio, o rastreaycompra.pages.dev por defecto.
      - name: Compilar APK
        run: ./gradlew assembleDebug --no-daemon -PtwaHost="${{ vars.TWA_HOST || 'rastreaycompra.pages.dev' }}"

      - name: Renombrar
        run: cp app/build/outputs/apk/debug/app-debug.apk "RastreaYCompra-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: rastreaycompra-apk
          path: twa/RastreaYCompra-*.apk
          retention-days: 30
